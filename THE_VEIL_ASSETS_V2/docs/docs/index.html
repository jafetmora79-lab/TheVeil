<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE VEIL — Asset Gallery</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script><style>:root{color-scheme:dark;--bg:#10151a;--panel:#1b242b;--edge:#35424b;--txt:#e8ecee;--muted:#a3b0b8;--accent:#a7d4bf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,sans-serif}header{padding:22px 24px;border-bottom:1px solid var(--edge)}h1{margin:0;font-size:25px;letter-spacing:.1em}header p{color:var(--muted);margin:8px 0 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid var(--edge)}input,select,button{background:var(--panel);border:1px solid var(--edge);color:var(--txt);border-radius:7px;padding:11px;font:inherit}input{min-width:240px;flex:1}button{cursor:pointer}button:hover{border-color:var(--accent)}.layout{display:grid;grid-template-columns:minmax(240px,330px) 1fr;min-height:calc(100vh - 180px)}aside{border-right:1px solid var(--edge);max-height:calc(100vh - 180px);overflow:auto}#status{padding:12px 16px;color:var(--muted);font-size:13px}#items{display:grid;gap:4px;padding:8px}.asset{display:block;width:100%;text-align:left;overflow-wrap:anywhere}.asset.active{border-color:var(--accent);background:#24372f}.asset small{display:block;color:var(--muted);margin-top:5px}.main{padding:16px;min-width:0}model-viewer{width:100%;height:min(65vh,650px);background:radial-gradient(circle,#35414b,#131b22);border:1px solid var(--edge);border-radius:12px}#empty{padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed var(--edge);border-radius:12px}#detail{padding:12px 2px;color:var(--muted);overflow-wrap:anywhere}a{color:var(--accent)}@media(max-width:740px){.layout{grid-template-columns:1fr}aside{max-height:240px;border-right:0;border-bottom:1px solid var(--edge)}model-viewer{height:55vh}} </style></head><body><header><h1>THE VEIL <span style="color:var(--accent)">/ ASSET GALLERY</span></h1><p>Greyhaven V2 • interactive 3D model browser • rotate, zoom and inspect</p></header><div class="toolbar"><input id="search" placeholder="Search models, folders or packs…" aria-label="Search"><select id="category" aria-label="Category"><option value="">All categories</option></select><button id="refresh">Refresh GitHub assets</button><button id="local">Open local GLB</button><input id="file" type="file" accept=".glb,.gltf" hidden></div><div class="layout"><aside><div id="status">Loading repository…</div><div id="items"></div></aside><main class="main"><div id="empty">Select a GLB model from the list, or choose <b>Open local GLB</b>.<p>Use mouse or touch to rotate and zoom.</p></div><model-viewer id="viewer" camera-controls auto-rotate shadow-intensity="0.5" interaction-prompt="auto" style="display:none"></model-viewer><div id="detail"></div></main></div><script>
const OWNER='jafetmora79-lab',REPO='TheVeil',BRANCH='claude/practical-cray-hi2y54',PREFIX='THE_VEIL_ASSETS_V2/';
const status=document.getElementById('status'),items=document.getElementById('items'),viewer=document.getElementById('viewer'),empty=document.getElementById('empty'),detail=document.getElementById('detail'),search=document.getElementById('search'),category=document.getElementById('category');let files=[],selected='',localURL=null;
const encPath=p=>p.split('/').map(encodeURIComponent).join('/');
const raw=p=>`https://raw.githubusercontent.com/${OWNER}/${REPO}/${encPath(BRANCH)}/${encPath(p)}`;
const label=p=>p.replace(PREFIX,'');
const cat=p=>{let s=label(p).split('/');return s.length>1?s[0]:'Root'};
function choose(p,url){selected=p;empty.style.display='none';viewer.style.display='block';viewer.src=url;viewer.alt=label(p);detail.replaceChildren();let title=document.createElement('div');title.textContent=label(p);detail.append(title);if(!p.startsWith('Local:')){let a=document.createElement('a');a.href=`https://github.com/${OWNER}/${REPO}/blob/${encPath(BRANCH)}/${encPath(p)}`;a.target='_blank';a.rel='noopener';a.textContent='View source on GitHub';detail.append(document.createElement('br'),a)}render()}
function render(){let q=search.value.trim().toLowerCase(),c=category.value;items.replaceChildren();let filtered=files.filter(p=>label(p).toLowerCase().includes(q)&&(!c||cat(p)===c));for(let p of filtered){let b=document.createElement('button');b.className='asset'+(selected===p?' active':'');let strong=document.createElement('strong');strong.textContent=p.split('/').at(-1);let small=document.createElement('small');small.textContent=label(p).split('/').slice(0,-1).join(' / ');b.append(strong,small);b.onclick=()=>choose(p,raw(p));items.append(b)}status.textContent=`${filtered.length} model(s) shown • ${files.length} total`}
async function load(){status.textContent='Loading models from GitHub…';try{let url=`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${encodeURIComponent(BRANCH)}?recursive=1`;let r=await fetch(url,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error(`GitHub API returned ${r.status}. The branch may be private, unavailable, or rate-limited.`);let data=await r.json();if(data.truncated)status.textContent='GitHub returned a partial tree; some models may be missing.';files=(data.tree||[]).filter(x=>x.type==='blob'&&x.path.startsWith(PREFIX)&&/\.glb$/i.test(x.path)).map(x=>x.path).sort();let cats=[...new Set(files.map(cat))].sort();category.replaceChildren(new Option('All categories',''),...cats.map(x=>new Option(x,x)));render();if(!files.length)status.textContent='No .glb files found in this branch and folder. You can still open local GLB files.'}catch(e){status.textContent=e.message+' You can still open local GLB files.'}}
search.addEventListener('input',render);category.addEventListener('change',render);document.getElementById('refresh').onclick=load;document.getElementById('local').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>{let f=e.target.files?.[0];if(!f)return;if(localURL)URL.revokeObjectURL(localURL);localURL=URL.createObjectURL(f);choose('Local: '+f.name,localURL)};viewer.addEventListener('error',()=>{detail.append(document.createTextNode(' — Model failed to load. Check that it is a valid GLB and publicly accessible.'))});load();
</script></body></html>
